{% macro prio(c) %}<span class="badge p-{{ c.priority_label|lower }}">{{ c.priority_label }} · {{ c.priority_score|round|int }}</span>{% endmacro %}
{% macro status(c) %}<span class="badge s-{{ c.status }}">{{ STATUS_LABEL[c.status] }}</span>{% endmacro %}
{% macro csrf_in() %}<input type="hidden" name="csrf" value="{{ csrf }}">{% endmacro %}
